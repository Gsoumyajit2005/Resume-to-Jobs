version: '3.8'

services:
  backend:
    build: ./backend
    container_name: resume-matcher-backend
    ports:
      - "8000:8000"
    # Change this line to point to the backend folder:
    env_file: ./backend/.env 
    restart: unless-stopped


  frontend:
    build: ./frontend
    container_name: resume-matcher-frontend
    ports:
      - "3000:80" # Maps your browser's 3000 to Nginx's 80
    depends_on:
      - backend
    restart: unless-stopped
